<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EduWorld</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; text-align: center; color: #f3f5ff;
         background: linear-gradient(180deg, #232a63 0%, #1a2052 55%, #151a42 100%); }
  .card { padding: 24px; max-width: 320px; }
  h1 { font-size: 28px; margin: 12px 0 8px; } p { opacity: .85; line-height: 1.5; }
  button { margin-top: 16px; border: 0; border-radius: 16px; padding: 14px 28px; font-size: 18px; font-weight: 700; background: #ffd76b; color: #4a3505; }
</style>
</head>
<body>
  <div class="card">
    <div style="font-size:64px">🦊</div>
    <h1>EduWorld</h1>
    <p>Нет подключения к интернету. Проверь Wi‑Fi или мобильный интернет и попробуй ещё раз.</p>
    <button onclick="location.reload()">Ещё раз</button>
  </div>
</body>
</html>
